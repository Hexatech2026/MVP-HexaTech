<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>MathGol — Cobrança de pênalti com matemática</title>
<meta name="description" content="MathGol: fase de pênaltis com perguntas de matemática, para crianças.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">

  <div class="topo">
    <p class="marca">
      <svg class="mascote mascote-mini" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="#FFFDF6" stroke="#21303B" stroke-width="5"/>
        <polygon points="50,28 63,38 58,54 42,54 37,38" fill="#21303B"/>
        <circle cx="34" cy="42" r="4" fill="#21303B"/>
        <circle cx="66" cy="42" r="4" fill="#21303B"/>
        <path d="M36 62 Q50 74 64 62" stroke="#21303B" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      MathGol
    </p>
    <button id="botao-acessibilidade" class="botao-icone" type="button" aria-label="Abrir opções de acessibilidade">♿</button>
  </div>

  <!-- ========== MENU ========== -->
  <section id="tela-menu" class="tela tela-menu">
    <div class="forma-confete forma-1" aria-hidden="true"></div>
    <div class="forma-confete forma-2" aria-hidden="true"></div>
    <div class="forma-confete forma-3" aria-hidden="true"></div>

    <svg class="mascote mascote-grande" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="#FFFDF6" stroke="#21303B" stroke-width="5"/>
      <polygon points="50,28 63,38 58,54 42,54 37,38" fill="#21303B"/>
      <circle cx="34" cy="40" r="4.5" fill="#21303B"/>
      <circle cx="66" cy="40" r="4.5" fill="#21303B"/>
      <path d="M35 60 Q50 74 65 60" stroke="#21303B" stroke-width="5" fill="none" stroke-linecap="round"/>
    </svg>

    <h1>MathGol</h1>
    <p class="subtitulo subtitulo-curto">Chuta, acerta e faz o gol! ⚽</p>
    <div class="pilha-botoes">
      <button id="botao-jogar" class="botao botao-cta" type="button">Jogar</button>
    </div>
  </section>

  <!-- ========== APELIDO ========== -->
  <section id="tela-apelido" class="tela">
    <h2>Seu apelido de craque</h2>
    <span class="selo">🔒 Sem nome real</span>
    <div class="avatar-apelido" id="avatar-apelido" aria-hidden="true">🧑‍🚀</div>
    <p id="texto-apelido" class="caixa-apelido">—</p>
    <div class="pilha-botoes">
      <button id="botao-sortear-apelido" class="botao botao-azul" type="button">🎲 Sortear outro</button>
      <button id="botao-confirmar-apelido" class="botao" type="button">Confirmar ✅</button>
    </div>
  </section>

  <!-- ========== SELEÇÃO ========== -->
  <section id="tela-selecao" class="tela">
    <h2>Escolha seu time</h2>
    <div id="grade-selecoes" class="grade-cartoes"></div>
    <div class="pilha-botoes" style="margin-top: 24px;">
      <button id="botao-confirmar-selecao" class="botao" type="button" disabled>Confirmar ✅</button>
    </div>
  </section>

  <!-- ========== DIFICULDADE ========== -->
  <section id="tela-dificuldade" class="tela">
    <h2>Nível do desafio</h2>
    <div id="grade-dificuldades" class="grade-cartoes"></div>
    <div class="pilha-botoes" style="margin-top: 24px;">
      <button id="botao-confirmar-dificuldade" class="botao" type="button" disabled>Bora jogar! ⚽</button>
    </div>
  </section>

  <!-- ========== FASE 1 ========== -->
  <section id="tela-fase1" class="tela">
    <div id="cabecalho-fase" class="cabecalho-fase"></div>

    <div class="caixa-pergunta">
      <p id="pergunta-texto" class="pergunta-texto">—</p>
    </div>

    <div class="palco-penalti">
      <div id="jogo-penalti"></div>
      <div id="zonas-gol" class="zonas-gol">
        <button class="botao-zona zona-topo-esquerda" type="button" data-zona="topo-esquerda">—</button>
        <button class="botao-zona zona-topo-direita" type="button" data-zona="topo-direita">—</button>
        <button class="botao-zona zona-meio" type="button" data-zona="meio">—</button>
        <button class="botao-zona zona-baixo-esquerda" type="button" data-zona="baixo-esquerda">—</button>
        <button class="botao-zona zona-baixo-direita" type="button" data-zona="baixo-direita">—</button>
      </div>
    </div>

    <p id="mensagem-feedback" class="mensagem-feedback"></p>
  </section>

  <!-- ========== RESULTADO ========== -->
  <section id="tela-resultado" class="tela">
    <h2>Fim da Fase 1!</h2>
    <p id="placar-final" class="placar-grande">0 / 3</p>
    <p id="resumo-resultado" class="resumo-resultado">—</p>
    <div class="pilha-botoes">
      <button id="botao-voltar-menu" class="botao" type="button">Voltar ao menu</button>
    </div>
  </section>

</div>

<!-- ========== MODAL DE ACESSIBILIDADE ========== -->
<div id="sobreposicao-acessibilidade" class="sobreposicao">
  <div class="painel-acessibilidade">
    <h2 style="text-align:left; margin-bottom:16px;">Acessibilidade</h2>

    <div class="linha-opcao">
      <label for="opcao-alto-contraste">Alto contraste</label>
      <span class="alternador">
        <input type="checkbox" id="opcao-alto-contraste">
        <span class="trilho-alternador"></span>
      </span>
    </div>

    <div class="linha-opcao">
      <label for="opcao-espaco-dislexia">Espaçamento para dislexia</label>
      <span class="alternador">
        <input type="checkbox" id="opcao-espaco-dislexia">
        <span class="trilho-alternador"></span>
      </span>
    </div>

    <div class="linha-opcao">
      <label for="opcao-narracao">Narração em áudio</label>
      <span class="alternador">
        <input type="checkbox" id="opcao-narracao">
        <span class="trilho-alternador"></span>
      </span>
    </div>

    <div class="pilha-botoes" style="margin-top: 20px;">
      <button id="botao-fechar-acessibilidade" class="botao" type="button">Fechar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="js/data.js"></script>
<script src="js/questions.js"></script>
<script src="js/narration.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
